name: Verify published privacy policy

on:
  workflow_dispatch:
  push:
    branches: [main, gh-pages]
    paths:
      - index.html
      - .github/workflows/verify-pages.yml

permissions: {}

jobs:
  verify-public-page:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check page without authentication
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          import urllib.request

          page_url = 'https://miguellamego13.github.io/ashfall-town-privacy/'
          source_url = 'https://raw.githubusercontent.com/MiguelLamego13/ashfall-town-privacy/gh-pages/index.html'

          def read_public(url):
              # No credentials, cookies or authentication headers are supplied.
              request = urllib.request.Request(url, headers={'User-Agent': 'AshfallTown-Privacy-Verification'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError('Unexpected HTTP status: ' + str(response.status))
                  return response.read(), response.headers.get_content_type(), response.geturl()

          for attempt in range(1, 7):
              try:
                  source, _, _ = read_public(source_url)
                  page, content_type, final_url = read_public(page_url)
                  if content_type != 'text/html':
                      raise RuntimeError('Expected HTML, received ' + content_type)
                  if hashlib.sha256(page).digest() != hashlib.sha256(source).digest():
                      raise RuntimeError('Published content does not yet match the deployment branch')
                  text = page.decode('utf-8')
                  for expected in ('Política de Privacidade', 'Ashfall Town', 'José Miguel Martins Costa', 'josemiguellamego@gmail.com', 'Conservação e eliminação de mensagens'):
                      if expected not in text:
                          raise RuntimeError('A required policy section is missing')
                  if any(warning in text.lower() for warning in ('rascunho', 'validação pendente', 'não publicar assim')):
                      raise RuntimeError('Draft wording remains in the page')
                  print('SUCCESS: public HTTPS page returned HTTP 200 without authentication.')
                  print('URL: ' + final_url)
                  print('Content-Type: ' + content_type)
                  print('Published HTML matches gh-pages/index.html exactly.')
                  print('Required policy details are present; draft wording is absent.')
                  break
              except Exception as error:
                  print('Attempt ' + str(attempt) + ': ' + str(error), flush=True)
                  if attempt == 6:
                      raise
                  time.sleep(10)
          PY
